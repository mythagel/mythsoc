# openocd.cfg -- ECP5 on Colorlight 5a-75b, FTDI-MPSSE JTAG reference.
#
# PRIMARY loader is openFPGALoader (design.md sec.1):
#   make prog    (SRAM, volatile)   make flash    (SPI U31, persistent)
# openocd is the fallback for SVF playback and chain probing; the adapter
# here is the generic FTDI MPSSE profile (same one chubby75 uses for this
# board; retarget for other adapters).
#
#   load SRAM : openocd -f board/openocd.cfg -c "init; pld load 0 build/top.bit; exit"
#   SVF       : openocd -f board/openocd.cfg -c "init; svf -quiet build/top.svf; exit"
#   chain     : openocd -f board/openocd.cfg -c "init; jtag arp scan_chain; exit"

source [find interface/ftdi/digilent_jtag_smt2.cfg]
adapter speed 1000          # dirtyJtag --freq 1000000 equivalent
transport select jtag
jtag newtap ecp5 tap -irlen 8 -expected-id 0x41111043   # LFE5U-25F
